<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazard Hunt: Safe Session Planning</title>
<style>
:root{--navy:#0f2742;--lime:#b6f03c;--ink:#16202b;--mut:#5b6b7c;--bg:#f3f6fa;--card:#fff;--line:#dfe6ee;--green:#1e9e57;--amber:#e69b00;--red:#d63031}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:sticky;top:0;z-index:20}
.top b{font-weight:800;letter-spacing:.2px}.top b span{color:var(--lime)}
.top button{background:#ffffff1a;color:#fff;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#0f2742,#1d4f7a);color:#fff;border-radius:20px;padding:22px}
.hero h1{margin:0 0 6px;font-size:clamp(24px,5vw,36px);line-height:1.1}
.hero p{margin:0;opacity:.9}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.step{background:#ffffff14;border-radius:14px;padding:10px;font-size:14px}.step b{display:block;color:var(--lime);font-size:18px}
h2{font-size:20px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .15s}
.sc:hover{transform:translateY(-2px)}
.sc svg{display:block;width:100%;height:auto;background:#ccc}
.sc div{padding:10px 12px}.sc small{color:var(--mut);display:block}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn.lime{background:var(--lime);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tool{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left}
.tool b{display:block;font-size:17px}.tool small{color:var(--mut)}
.bar{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.bar h1{font-size:20px;margin:0}.bar p{margin:2px 0 0;color:var(--mut);font-size:14px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.stage{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px #0f274222;background:#000}
.stage svg{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.live{position:absolute;top:10px;left:10px;background:#d63031;color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:1px}
.live::before{content:"";display:inline-block;width:7px;height:7px;background:#fff;border-radius:50%;margin-right:5px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.bob{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box}
.bob2{animation:bob2 2.2s ease-in-out infinite}
.sway{animation:sway 3s ease-in-out infinite alternate}.sway2{animation:sway 2.4s ease-in-out infinite alternate-reverse}
@keyframes bob{50%{transform:translateY(-22px)}}@keyframes bob2{50%{transform:translateY(5px)}}@keyframes sway{to{transform:translateX(26px)}}
.miss{animation:fade 1s forwards}@keyframes fade{to{opacity:0}}
.hintring{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:#e6f8ee;color:#126b3b;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.card h2{margin:6px 0 10px}
.mini{border-radius:12px;overflow:hidden;margin-bottom:10px}.mini svg{display:block;width:100%;height:auto}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;margin-right:4px;text-transform:uppercase;letter-spacing:.5px}
.t-cat{background:#e8eef6;color:var(--navy)}.t-found{background:#e6f8ee;color:#126b3b}.t-miss{background:#fde8e8;color:#a42020}
details{background:#f6f9fc;border-radius:12px;padding:10px 12px;margin:10px 0}
summary{cursor:pointer;font-weight:600}
h3{font-size:16px;margin:16px 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;cursor:pointer;font-weight:600}
.seg button small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}.seg button.on small{color:#cfe0f2}
.riskbox{margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:700;color:#fff}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.opt:disabled{color:var(--ink);cursor:default}.opt.ok{border-color:var(--green);background:#e6f8ee}.opt.bad{border-color:var(--red);background:#fde8e8}
.fb{margin-top:10px;padding:12px;border-radius:12px;background:#f6f9fc}
textarea,input[type=text],select{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px;background:#fff}
textarea{min-height:60px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:#eef3f8}
.tablewrap{overflow-x:auto;border-radius:12px}
.badge{display:inline-block;color:#fff;border-radius:8px;padding:2px 8px;font-weight:700;font-size:13px;white-space:nowrap}
.big{font-size:44px;font-weight:800;color:var(--navy);margin:4px 0}
.prow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
label{font-size:13px;font-weight:600;color:var(--mut)}
.checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:400;font-size:15px;padding:4px 0}
.photo{position:relative;border-radius:14px;overflow:hidden;cursor:crosshair}.photo img{display:block;width:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#d63031;color:#fff;font-weight:800;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px #0006;pointer-events:none}
.matrix td{text-align:center;font-weight:700;color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;transition:transform .25s;z-index:200;box-shadow:0 6px 20px #0005;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:60;padding:16px}
.modal .card{max-width:640px;width:100%}
.note{font-size:14px;color:var(--mut)}
.sheet{max-height:92vh;overflow:auto;width:100%;max-width:680px;position:relative}
.xwrap{position:sticky;top:0;height:0;z-index:5;display:flex;justify-content:flex-end}.xbtn{margin:6px 6px 0 0;width:40px;height:40px;border-radius:50%;border:0;background:#0f2742;color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px #0004}
.modal{align-items:start;overflow:auto}
.tw{position:relative}.tw textarea{padding-right:50px;min-height:80px}
.mic{position:absolute;right:8px;bottom:10px;border:0;border-radius:50%;width:40px;height:40px;background:#eef3f8;font-size:18px;cursor:pointer}.mic.on{background:#d63031;animation:pulse 1s infinite}
.wc.err{color:#fff!important;background:#d63031;padding:6px 10px;border-radius:8px;font-size:14px;font-weight:600}.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}textarea.bad{border-color:#d63031}
.wc{display:block;color:var(--mut);margin:4px 0 0;font-size:12px}
.ans{background:#f6f9fc;border-left:4px solid var(--navy);padding:8px 12px;border-radius:8px;margin:6px 0}
.model{background:#eefaf3;border-left:4px solid var(--green);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.crit{list-style:none;padding:0;margin:6px 0}.crit li{padding:2px 0}
.warn{background:#fff4e0;border-radius:8px;padding:8px 10px;margin:8px 0}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.starters button{border:1px dashed var(--navy);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
.ladder{display:grid;gap:6px}.ladder button{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}.ladder button small{color:var(--mut);margin-left:6px}.ladder button.on{border-color:var(--navy);background:var(--navy);color:#fff}.ladder button.on small{color:#cfe0f2}
.claude{background:#f3efff;border-left:4px solid #7c5cd6;padding:8px 12px;border-radius:8px;margin-top:8px}
.player{display:flex;align-items:center;gap:10px;background:#0f2742;color:#fff;padding:8px 12px;border-radius:0 0 16px 16px;margin-top:-8px;position:relative;z-index:1}
.pbtn{background:var(--lime);color:var(--navy);border:0;border-radius:50%;width:42px;height:42px;font-size:18px;font-weight:800;cursor:pointer;flex:none}.pbtn.sm{border-radius:999px;width:auto;padding:0 12px;height:34px;font-size:13px;background:#ffffff22;color:#fff}
.track{flex:1;height:10px;background:#ffffff33;border-radius:999px;position:relative;cursor:pointer}.fill{height:100%;background:var(--lime);border-radius:999px;width:0}
.tick{position:absolute;top:-4px;width:6px;height:18px;background:#00e676;border-radius:3px;transform:translateX(-3px)}
#ct{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.photo video{display:block;width:100%}.ov{position:absolute;inset:0;display:none;cursor:crosshair}.ov.on{display:block;background:#ffd40014;outline:4px dashed #ffd400;outline-offset:-4px}
#pinlayer{position:absolute;inset:0;pointer-events:none}
label.tick{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-weight:400;font-size:15px;padding:4px 0;position:static;width:auto;height:auto;background:none}
.chip{border:0;cursor:pointer}
@media(max-width:600px){.steps{grid-template-columns:1fr}.two{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<div class="top"><b>Hazard <span>Hunt</span></b><button id="homeBtn">🏠 Home</button></div>
<main id="app"></main>
<div id="toast"></div>
<script>
const R=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
const LN=['','Unlikely','Possible','Likely'],SN=['','Minor','Moderate','Serious'];
const LD=['','Could happen, but rarely','Could happen sometimes','Will probably happen'],SD=['','Bruise, graze','Sprain, cut, first aid','Fracture, head/spinal, hospital'];
const band=r=>r<=2?['Low','#1e9e57']:r<=4?['Medium','#e69b00']:['High','#d63031'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- drawing helpers ---------- */
function P(x,y,c,o={}){const s=o.s||1,sk=o.skin||'#f1c27d',sh=o.shorts||'#1f2a3a',f=o.face||1,hair=o.hair||'#3b2a1a',ph=o.ph??0;
 let lA,lB,rA,rB,aL,bL,aR,bR;
 if(o.run){const p=o.ph??0.9;lA=0.75*Math.sin(p);rA=-lA;lB=0.2+1.0*Math.max(0,Math.sin(p+1.7));rB=0.2+1.0*Math.max(0,Math.sin(p+1.7+Math.PI));aL=-0.8*Math.sin(p);aR=-aL;bL=1.3;bR=1.3}
 else if(o.throw){lA=-.35;rA=.4;lB=.15;rB=.25;aL=-1.3;bL=-.2;aR=Math.PI-.35;bR=.25}
 else if(o.dive){lA=0;rA=0;lB=0;rB=0;aL=Math.PI;aR=Math.PI;bL=0;bR=0}
 else if(o.jump){lA=.35;rA=-.15;lB=1.1;rB=.8;aL=Math.PI-.5;aR=Math.PI-.2;bL=0;bR=0}
 else{const w=0.06*Math.sin(ph*.6);lA=-.1+w;rA=.1-w;lB=.08;rB=.08;aL=.1;aR=-.06;bL=.15;bR=.12}
 if(o.rk!=null){aR=o.rk;bR=.25}
 const leg=(hx,a,b,back)=>{const kx=hx+Math.sin(a)*17,ky=44+Math.cos(a)*17,fx=kx+Math.sin(a-b)*17,fy=ky+Math.cos(a-b)*17,tx=hx+Math.sin(a)*7,ty=44+Math.cos(a)*7;
  return `<g stroke-linecap="round" fill="none"><path d="M${hx} 44 L${kx.toFixed(1)} ${ky.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" stroke="${sk}" stroke-width="7.5" stroke-linejoin="round"/><path d="M${(kx+(fx-kx)*.62).toFixed(1)} ${(ky+(fy-ky)*.62).toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" stroke="#f4f4f4" stroke-width="8"/><line x1="${hx}" y1="43" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${sh}" stroke-width="11"/>${back?`<path d="M${hx} 44 L${kx.toFixed(1)} ${ky.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" stroke="#000" stroke-opacity=".14" stroke-width="7.5" stroke-linejoin="round"/>`:''}</g><ellipse cx="${(fx+3.5).toFixed(1)}" cy="${(fy+1.5).toFixed(1)}" rx="7" ry="3.8" fill="#222"/>`};
 const arm=(sx,a,b,back,rk)=>{const ex=sx+Math.sin(a)*13,ey=17+Math.cos(a)*13,hx=ex+Math.sin(a+b)*12,hy=ey+Math.cos(a+b)*12;let r='';
  if(rk){const d=a+b,ux=Math.sin(d),uy=Math.cos(d),cx=hx+ux*34,cy=hy+uy*34;r=`<line x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${(hx+ux*24).toFixed(1)}" y2="${(hy+uy*24).toFixed(1)}" stroke="#444" stroke-width="2.6"/><ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="7.5" ry="11" transform="rotate(${(-d*180/Math.PI).toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="#ffffff30" stroke="#e74c3c" stroke-width="2.6"/>`}
  return `<path d="M${sx} 17 L${ex.toFixed(1)} ${ey.toFixed(1)} L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="${sk}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M${sx} 17 L${(sx+Math.sin(a)*7).toFixed(1)} ${(17+Math.cos(a)*7).toFixed(1)}" stroke="${c}" stroke-width="9" stroke-linecap="round"/>${back?`<path d="M${sx} 17 L${ex.toFixed(1)} ${ey.toFixed(1)} L${hx.toFixed(1)} ${hy.toFixed(1)}" stroke="#000" stroke-opacity=".14" stroke-width="6" stroke-linecap="round" fill="none"/>`:''}<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="3.3" fill="${sk}"/>${r}`};
 const shadow=(!o.rot&&!o.noshadow)?`<ellipse cx="${x}" cy="${y+81*s}" rx="${17*s}" ry="${4.5*s}" fill="#000" opacity=".2"/>`:'';
 return `${shadow}<g transform="translate(${x} ${y}) scale(${s})${o.rot?` rotate(${o.rot})`:''}"><g transform="scale(${f} 1)${o.run&&!o.rot?' rotate(8)':''}">
 ${arm(-2,aL,bL,1)}${leg(-4,lA,lB,1)}
 <path d="M-11 15 Q0 10 11 15 L9 41 Q0 44 -9 41 Z" fill="${c}"/><path d="M4 13 Q10 14 11 15 L9 41 Q6 43 3 43 Z" fill="#000" opacity=".12"/>
 <rect x="-11" y="38" width="22" height="9" rx="4" fill="${sh}"/>
 ${leg(4,rA,rB,0)}${arm(3,aR,bR,0,o.rk!=null)}
 <rect x="-3" y="7" width="6" height="7" fill="${sk}"/><circle r="10" fill="${sk}"/><circle cx="-2" cy="1" r="2.4" fill="#000" opacity=".08"/>
 <path d="M-10 0 A10 10 0 0 1 10 -1 Q8 -7 2 -9 Q-6 -11 -10 -4 Z" fill="${hair}"/><path d="M-10 -2 Q-12 4 -8 6 L-6 0Z" fill="${hair}"/>
 <circle cx="5.5" cy="-1" r="1.4" fill="#222"/>
 ${o.jew?'<path d="M-6 12 q6 9 12 0" stroke="#f5c400" stroke-width="2.5" fill="none"/><circle cx="-1" cy="5" r="2.6" fill="#f5c400"/>':''}
 ${o.whistle?'<line x1="0" y1="13" x2="2" y2="26" stroke="#222" stroke-width="1.5"/><rect x="0" y="25" width="7" height="5" rx="1" fill="#bbb"/>':''}
 ${o.throw?`<circle cx="${(3+Math.sin(aR)*13+Math.sin(aR+bR)*12).toFixed(1)}" cy="${(17+Math.cos(aR)*13+Math.cos(aR+bR)*12-5).toFixed(1)}" r="7" fill="#555"/>`:''}
 </g></g>`}
const ball=(x,y,r,c,cls='')=>`<circle class="${cls}" cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#0003" stroke-width="2"/>`;
const bench=(x,y,w)=>`<g><rect x="${x+8}" y="${y+8}" width="9" height="22" fill="#6b4420"/><rect x="${x+w-17}" y="${y+8}" width="9" height="22" fill="#6b4420"/><rect x="${x}" y="${y}" width="${w}" height="12" rx="3" fill="#8b5a2b"/></g>`;
const bag=(x,y,c)=>`<g><path d="M${x+9} ${y} a8 8 0 0 1 16 0" stroke="${c}" fill="none" stroke-width="3"/><rect x="${x}" y="${y}" width="34" height="24" rx="6" fill="${c}"/></g>`;
const cone=(x,y)=>`<g><polygon points="${x-9},${y} ${x+9},${y} ${x+3},${y-22} ${x-3},${y-22}" fill="#ff7a00"/><rect x="${x-12}" y="${y}" width="24" height="4" fill="#d35f00"/></g>`;

/* ---------- scenes ---------- */
function s1(){return `
<rect width="800" height="195" fill="#efe6d6"/>
${R(5,i=>`<rect x="${140+i*95}" y="22" width="62" height="40" rx="3" fill="#cfe8f7" stroke="#b8a98f" stroke-width="3"/>`)}
<g stroke="#a8743c" stroke-width="5">${R(6,i=>`<line x1="${22+i*13}" y1="58" x2="${22+i*13}" y2="195"/>`)}</g>
<g stroke="#a8743c" stroke-width="3">${R(10,i=>`<line x1="18" y1="${70+i*13}" x2="92" y2="${70+i*13}"/>`)}</g>
<rect x="660" y="70" width="84" height="125" fill="#93a6ba" stroke="#6d7f92" stroke-width="3"/>
<rect x="672" y="44" width="60" height="20" rx="3" fill="#159447"/><text x="702" y="59" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">EXIT</text>
<rect y="195" width="800" height="305" fill="#e3b97c"/>
${R(8,i=>`<line x1="0" y1="${215+i*38}" x2="800" y2="${215+i*38}" stroke="#d3a364" stroke-width="2"/>`)}
<rect x="60" y="232" width="680" height="250" fill="none" stroke="#fff" stroke-width="3"/>
<line x1="400" y1="232" x2="400" y2="482" stroke="#fff" stroke-width="3"/>
<circle cx="400" cy="357" r="45" fill="none" stroke="#d33" stroke-width="3"/>
<g><rect x="656" y="134" width="94" height="17" rx="4" fill="#3575e0"/><rect x="652" y="151" width="100" height="17" rx="4" fill="#2a66d0"/><rect x="648" y="168" width="108" height="17" rx="4" fill="#1f56b8"/><rect x="645" y="185" width="114" height="17" rx="4" fill="#1a4aa0"/></g>
${bag(95,208,'#c0392b')}${bag(132,214,'#2c3e50')}${bag(170,206,'#8e44ad')}<ellipse cx="215" cy="230" rx="22" ry="9" fill="#16a085"/>
${bench(250,375,150)}
<ellipse cx="548" cy="440" rx="50" ry="13" fill="#7cc8f2" opacity=".8"/><ellipse cx="532" cy="437" rx="15" ry="3" fill="#fff" opacity=".8"/>
<rect x="590" y="432" width="32" height="14" rx="6" fill="#2e86de"/>
${P(720,252,'#16324f',{whistle:1,hair:'#4a3020'})}
<g class="sway">${P(210,262,'#e74c3c',{run:1,hair:'#2b1b10'})}</g>
${P(430,262,'#27ae60',{jew:1,hair:'#d9a441',skin:'#e0ac69'})}
<g class="sway2">${P(575,300,'#e74c3c',{run:1,skin:'#8d5524',hair:'#1b1b1b'})}</g>
${P(150,330,'#27ae60',{skin:'#c68642',hair:'#1b1b1b'})}
${ball(480,405,11,'#e74c3c','bob')}${ball(660,455,11,'#f1c40f')}`}

function s2(){return `

function openSheet(i){st.cur=i;const sc=S[st.si],h=sc.hz[i],found=st.found.has(i);
 const a=st.ans[i]||(st.ans[i]={step:found?0:1});

 const rated=a.L&&a.S,r=rated?a.L*a.S:0,[bn,bc]=band(r);

 if(a.step===0){H+=`<h2>🔍 What have you spotted?</h2><p class="note">Describe the hazard in your own words before we tell you what it is.</p>${ta(a,'name','e.g. There is a … on the floor where people are running',3)}<div class="actions"><button class="btn lime" data-go="1">Check →</button></div>`}
 else{H+=`<span class="tag t-cat">${h.cat}</span><span class="tag ${found?'t-found':'t-miss'}">${found?'You spotted this':'You missed this one'}</span><h2>${esc(h.t)}</h2>${a.name?`<p class="note">You said: “${esc(a.name)}”</p>`:''}

 if(a.step>=2){H+=`<h3>2. Rate the risk</h3><div class="seg" data-k="L">${[1,2,3].map(v=>`<button class="${a.L===v?'on':''}" data-v="${v}">${v} · ${LN[v]}<small>${LD[v]}</small></button>`).join('')}</div><div class="seg" data-k="S" style="margin-top:8px">${[1,2,3].map(v=>`<button class="${a.S===v?'on':''}" data-v="${v}">${v} · ${SN[v]}<small>${SD[v]}</small></button>`).join('')}</div>
  ${rated?`<div class="riskbox" style="background:${bc}">Your rating: ${a.L} × ${a.S} = ${r} · ${bn} risk</div>`:''}${a.step===2?`<div class="actions"><button class="btn lime" data-go="3" ${rated?'':'disabled'}>Next →</button></div>`:''}`}
 if(a.step>=3){H+=`<h3>3. How would YOU minimise the risk?</h3>`;
  if(a.step===3){H+=`<p class="note">Be specific: <b>what</b> you would do, <b>when</b>, and <b>why</b> it makes it safer. “Tell them to be careful” won’t score.</p>

  ${ta(a,'ctrl','Type or say your control measure…',8)}

  <div class="actions"><button class="btn lime" data-go="4">Submit my answer →</button></div>`}
  else{const c=a.crit;H+=`<p class="ans">${esc(a.ctrl)}</p>
  <div class="fb"><b>Success criteria: ${c.filter(Boolean).length}/3 (+${c.filter(Boolean).length*5} ⭐)</b><ul class="crit">${[h.l1,h.l2,'Explains why it makes it safer'].map((l,j)=>`<li>${c[j]?'✅':'⬜'} ${esc(l)}</li>`).join('')}</ul>
  ${a.weak?'<p class="warn">⚠️ Your answer sounds like a warning (“be careful”, “watch out”). Warnings rely on people remembering. What would you actually <b>do</b> to the hazard?</p>':''}

  ${SAMPLE?`<div class="actions"><button class="btn ghost" id="ask">🤖 Get feedback from Claude</button></div><div id="cfb">${a.claude?a.claude:''}</div>`:''}
  <h3>4. Improve your answer ✏️</h3><p class="note">Rewrite your control using what you have learned. Add <b>when</b> you would do it, <b>who</b> does it, or <b>how you’d check</b> it.</p>

  <div class="actions"><button class="btn lime" id="fin">${st.queue&&st.queue.length?'Save & next hazard →':(sc.clip?'Save & back to the clip →':'Save & back to the scene →')}</button></div>`}}
 H+=`</div>`;m.innerHTML=H;const card=m.querySelector('.sheet');bindTA(card,a);

 card.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{a.lvlU=+b.dataset.lv;card.querySelectorAll('[data-lv]').forEach(x=>x.classList.toggle('on',x===b))});

  if(g===1&&!need(a,'name',3,'your description'))return;

   const t=a.ctrl.toLowerCase();a.crit=[has(t,h.k1),has(t,h.k2),has(t,WHY)];a.weak=has(t,WEAK)&&!a.crit[0];a.close=Math.abs(a.L*a.S-h.L*h.S)<=2;
   a.pts=a.crit.filter(Boolean).length*5+(a.close?5:0);st.score+=a.pts;const s=document.getElementById('scr');if(s)s.textContent=`⭐ ${st.score}`}

  const ans=a.imp&&wc(a.imp)>=5?a.imp:a.ctrl;

function evidenceText(){const sc=S[st.si];const order=[...[...st.found],...sc.hz.map((_,i)=>i).filter(i=>!st.found.has(i))];

 box.innerHTML=photo.pins.map((p,i)=>{const s=p.L*p.S,[b,c]=band(s);return `<div class="prow" data-i="${i}"><div style="display:flex;justify-content:space-between;align-items:center"><b>📍 Hazard ${i+1}</b>${p.time!=null?`<button class="btn ghost" data-seek="${i}" style="padding:6px 10px">⏱ ${fmt(p.time)}</button>`:''}</div>
 <input type="text" data-f="t" value="${esc(p.t)}" placeholder="What is the hazard?"><input type="text" data-f="who" value="${esc(p.who)}" placeholder="Who is at risk, and what could happen?">
 <div class="three"><div><label>Likelihood</label><select data-f="L">${[1,2,3].map(v=>`<option value="${v}" ${p.L==v?'selected':''}>${v} ${LN[v]}</option>`).join('')}</select></div><div><label>Severity</label><select data-f="S">${[1,2,3].map(v=>`<option value="${v}" ${p.S==v?'selected':''}>${v} ${SN[v]}</option>`).join('')}</select></div><span class="badge" style="background:${c};padding:10px">${s} ${b}</span></div>
 <textarea data-f="c" placeholder="How would you minimise the risk? What, when, and why?">${esc(p.c)}</textarea><div><button class="btn ghost" data-del="${i}">🗑 Remove</button></div></div>`}).join('')+(photo.pins.length?`<div class="actions"><button class="btn lime" id="cpp">📋 Copy my hazard list</button></div>`:'');
 box.querySelectorAll('.prow').forEach(row=>{const p=photo.pins[+row.dataset.i];row.querySelectorAll('[data-f]').forEach(e=>{const f=e.dataset.f;e.oninput=e.onchange=()=>{p[f]=(f==='L'||f==='S')?+e.value:e.value;if(e.tagName==='SELECT')drawPins()}})});
 box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{photo.pins.splice(+b.dataset.del,1);drawPins();drawPinLayer()});
 box.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{const v=document.getElementById('vid');if(v){v.currentTime=photo.pins[+b.dataset.seek].time;v.pause();v.scrollIntoView({behavior:'smooth',block:'center'})}});
 const cpp=document.getElementById('cpp');if(cpp)cpp.onclick=()=>copyText('HAZARDS SPOTTED IN MY '+(photo.kind==='video'?'VIDEO':'PHOTO')+'\n\n'+photo.pins.map((p,i)=>`${i+1}. ${p.t}${p.time!=null?` (at ${fmt(p.time)})`:''}\n   Who/harm: ${p.who}\n   Risk: ${p.L} x ${p.S} = ${p.L*p.S} (${band(p.L*p.S)[0]})\n   Control: ${p.c}`).join('\n\n'))}

const CHECKS=['Facility checked (floor, surface, exits, lighting)','Equipment checked and suitable for age and ability','Weather checked, with a backup plan','Pupil medical info and injuries checked (asthma, allergies)','Jewellery removed and correct kit worn','First aid kit present and stocked','Group size and supervision ratio are safe','Warm-up and cool-down planned','Rules and safety briefing planned for the start'];
function plannerV(){planner=planner||store.get('hh_plan',null)||{info:{activity:'',venue:'',group:'',date:'',leader:''},rows:[],checks:{},eap:{aider:'',kit:'',phone:'',access:'',meet:''}};
 const save=()=>store.set('hh_plan',planner);
 const bankList=S.flatMap(s=>s.hz.map(h=>({h,label:`${s.icon} ${h.t}`})));
 app.innerHTML=`<div class="bar"><div><h1>📝 Session risk assessment</h1><p>Plan a session you will lead. Think about <b>People · Equipment · Environment · Procedures</b>.</p></div></div>
 <div class="card"><div class="two">${[['activity','Activity / sport','e.g. Badminton: introducing the overhead clear'],['venue','Venue','e.g. Sports hall'],['group','Group (age, number, ability)','e.g. 12 Year 7s, mixed ability'],['date','Date','dd/mm/yyyy'],['leader','Session leader','Your name']].map(([k,l,ph])=>`<div><label>${l}</label><input type="text" data-info="${k}" placeholder="${ph}" value="${esc(planner.info[k])}"></div>`).join('')}</div></div>
 <h2>Hazards & controls</h2><div id="rows">${planner.rows.map((r,i)=>{const s=r.L*r.S,[b,c]=band(s);return `<div class="prow" data-i="${i}">
 <div class="two"><div><label>Hazard ${i+1}</label><input type="text" data-f="t" value="${esc(r.t)}" placeholder="What could cause harm?"></div><div><label>Category</label><select data-f="cat">${['People','Equipment','Environment','Procedures'].map(x=>`<option ${r.cat===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <div><label>Who is at risk, and what could happen?</label><input type="text" data-f="who" value="${esc(r.who)}"></div>
 <div class="three"><div><label>Likelihood</label><select data-f="L">${[1,2,3].map(v=>`<option value="${v}" ${r.L==v?'selected':''}>${v} ${LN[v]}</option>`).join('')}</select></div><div><label>Severity</label><select data-f="S">${[1,2,3].map(v=>`<option value="${v}" ${r.S==v?'selected':''}>${v} ${SN[v]}</option>`).join('')}</select></div><span class="badge" style="background:${c};padding:10px">${s} ${b}</span></div>
 <div><label>Control measures (how will you minimise the risk?)</label><textarea data-f="c" placeholder="Remove it? Reduce it? Keep people away from it? A rule or supervision? PPE?">${esc(r.c)}</textarea></div>
 <div><button class="btn ghost" data-del="${i}">🗑 Remove</button></div></div>`}).join('')||'<p class="note">No hazards yet. Add your own or pick one from the hazard bank.</p>'}</div>
 <div class="two"><button class="btn" id="add">+ Add a hazard</button><select id="bankSel"><option value="">+ Add from the hazard bank…</option>${bankList.map((b,j)=>`<option value="${j}">${esc(b.label)}</option>`).join('')}</select></div>
 <h2>Pre-session checks</h2><div class="card checks">${CHECKS.map((c,i)=>`<label><input type="checkbox" data-ck="${i}" ${planner.checks[i]?'checked':''}> ${c}</label>`).join('')}</div>
 <h2>Emergency action plan</h2><div class="card two">${[['aider','First aider'],['kit','Where the first aid kit is'],['phone','Nearest phone / how to call 999'],['access','Access route for an ambulance'],['meet','Fire assembly point']].map(([k,l])=>`<div><label>${l}</label><input type="text" data-eap="${k}" value="${esc(planner.eap[k])}"></div>`).join('')}</div>
 <div class="actions"><button class="btn lime" id="cp">📋 Copy my risk assessment</button><button class="btn ghost" id="clr">Start again</button></div>`;
 app.querySelectorAll('[data-info]').forEach(e=>e.oninput=()=>{planner.info[e.dataset.info]=e.value;save()});
 app.querySelectorAll('[data-eap]').forEach(e=>e.oninput=()=>{planner.eap[e.dataset.eap]=e.value;save()});
 app.querySelectorAll('[data-ck]').forEach(e=>e.onchange=()=>{planner.checks[e.dataset.ck]=e.checked;save()});
 app.querySelectorAll('.prow').forEach(row=>{const r=planner.rows[+row.dataset.i];row.querySelectorAll('[data-f]').forEach(e=>{const f=e.dataset.f;e.oninput=e.onchange=()=>{r[f]=(f==='L'||f==='S')?+e.value:e.value;save();if(e.tagName==='SELECT'&&(f==='L'||f==='S'))plannerV()}})});
 app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{planner.rows.splice(+b.dataset.del,1);save();plannerV()});
 add.onclick=()=>{planner.rows.push({t:'',cat:'Environment',who:'',L:2,S:2,c:''});save();plannerV()};
 const bs=document.getElementById('bankSel');bs.onchange=()=>{if(bs.value==='')return;const it=bankList[+bs.value].h;planner.rows.push({t:it.t,cat:it.cat,who:`${it.who}: ${it.harm}`,L:it.L,S:it.S,c:''});save();plannerV();toast('Added. Now write your own control measure')};
 clr.onclick=()=>{if(clr.dataset.sure){planner=null;store.set('hh_plan',null);plannerV()}else{clr.dataset.sure=1;clr.textContent='Tap again to clear everything'}};
 cp.onclick=()=>{const I=planner.info;copyText(`SESSION RISK ASSESSMENT\nActivity: ${I.activity}\nVenue: ${I.venue}\nGroup: ${I.group}\nDate: ${I.date}\nLeader: ${I.leader}\n\nHAZARDS AND CONTROLS\n`+planner.rows.map((r,i)=>`${i+1}. ${r.t} (${r.cat})\n   Who/harm: ${r.who}\n   Risk: ${r.L} x ${r.S} = ${r.L*r.S} (${band(r.L*r.S)[0]})\n   Controls: ${r.c}`).join('\n\n')+`\n\nPRE-SESSION CHECKS\n`+CHECKS.map((c,i)=>`[${planner.checks[i]?'x':' '}] ${c}`).join('\n')+`\n\nEMERGENCY ACTION PLAN\nFirst aider: ${planner.eap.aider}\nFirst aid kit: ${planner.eap.kit}\nPhone / 999: ${planner.eap.phone}\nAmbulance access: ${planner.eap.access}\nAssembly point: ${planner.eap.meet}`)}}

function guide(){app.innerHTML=`<div class="bar"><div><h1>📘 Risk rating guide</h1><p>The key ideas you need when planning a safe session.</p></div></div>
 <div class="card"><h3 style="margin-top:0">Hazard or risk?</h3><p><b>Hazard:</b> something that could cause harm (a wet floor).<br><b>Risk:</b> how likely it is that someone is harmed, and how badly (someone slips and breaks a wrist).</p>
 <h3>Risk = Likelihood × Severity</h3><div class="tablewrap"><table class="matrix"><tr><th></th><th>1 Minor</th><th>2 Moderate</th><th>3 Serious</th></tr>${[3,2,1].map(l=>`<tr><th>${l} ${LN[l]}</th>${[1,2,3].map(s=>{const[b,c]=band(l*s);return `<td style="background:${c}">${l*s} ${b}</td>`}).join('')}</tr>`).join('')}</table></div>
 <p class="note">High (6–9): do not start until it is controlled. Medium (3–4): control it before or during the session. Low (1–2): monitor it.</p>
 <h3>Choosing the best control: strongest first</h3><ol><li><b>Remove it</b>: move the benches, clear the glass.</li><li><b>Reduce or replace it</b>: lighter weights, softer balls, a smaller area.</li><li><b>Keep people away from it</b>: cone it off, mark a waiting line.</li><li><b>Rules and supervision</b>: a safety briefing, a spotter, a “walk on poolside” rule.</li><li><b>Protective kit</b>: shin pads, gum shields, helmets.</li></ol>
 <p class="note">“Tell them to be careful” is almost never the best answer.</p>
 <h3>Where to look: PEEP</h3><p><b>People</b> (medical needs, jewellery, kit, behaviour, numbers) · <b>Equipment</b> (damaged, unsuitable, left out) · <b>Environment</b> (surface, weather, obstacles, exits) · <b>Procedures</b> (rules, supervision, emergency action plan, first aid)</p></div>
 <div class="actions"><button class="btn lime" id="bk">Back to the game</button></div>`;bk.onclick=()=>go('home')}

render();
</script>
</body>
</html>
